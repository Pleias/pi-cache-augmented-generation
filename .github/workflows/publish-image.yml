# Build the multi-arch CAG image and publish it to GHCR on every version tag.
name: publish-image

on:
  push:
    # Tags (v*) land on commits already on main, so no branch filter is needed —
    # tag-push events are independent of branch filters and fire on the tag ref itself.
    tags:
      - 'v*'

permissions:
  contents: write      # checkout + create the GitHub Release
  packages: write      # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # QEMU provides the arm64 emulation used to build the linux/arm64 leg on an
      # amd64 runner. That leg is slow under emulation; the first run is long. The
      # ~1.12 GB model GGUF is NOT re-downloaded per platform: the model stage is
      # pinned to $BUILDPLATFORM in the Dockerfile, so it is fetched once natively
      # and COPY --from'd into both arch images (and cached via GHA across runs).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels, annotations)
        id: meta
        uses: docker/metadata-action@v6
        # DOCKER_METADATA_ANNOTATIONS_LEVELS=manifest,index makes the action emit each OCI
        # annotation for BOTH the per-arch manifests and the image index. GHCR renders the
        # package page's description from org.opencontainers.image.description on the INDEX,
        # so for a multi-arch image the index level is required — a label/manifest-only
        # annotation would not surface on the package page.
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/cag-app
          # v1.2.3 -> tags 1.2.3, 1.2, and latest (latest auto-added for
          # non-prerelease semver tags; pre-releases are skipped for latest).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # org.opencontainers.image.source/url/title/etc. are auto-derived from the repo by
          # metadata-action. NOTE: this repo is PRIVATE while the package is PUBLIC — the
          # source label still links the package to the repo, but public visitors cannot see
          # the repo README on the package page (nor the GitHub Release below). The index-
          # level description annotation is therefore the ONLY doc public users see on the
          # package page, so it carries the run command; the full doc is baked into the image
          # at /CONTAINER.md (see Dockerfile).
          labels: |
            org.opencontainers.image.description=Cache-Augmented Generation demo (llama-server + FastAPI + Qwen2.5-1.5B Q4_K_M baked in, no data; amd64/arm64, Raspberry Pi 4 floor). Run: docker run -d -p 8000:8000 -v $HOME/cag-data:/data ghcr.io/pleias/cag-app — open http://localhost:8000, paste a document (<=12k tokens), chat; cache persists across restarts. Full doc inside the image: docker run --rm --entrypoint cat ghcr.io/pleias/cag-app /CONTAINER.md

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # No BuildKit provenance attestation: it lands in the index as a third
          # "unknown/unknown" entry on the GHCR package page (community#45969). For this
          # demo image the SLSA metadata is not worth the confusing arch listing.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish CONTAINER.md alongside the release so the container usage doc ships with the
      # tag. The package page itself renders the repo README (via the source label above);
      # this Release makes the container-specific doc a first-class, downloadable artifact.
      - name: Create GitHub Release with container doc
        uses: softprops/action-gh-release@v3
        with:
          body_path: app/CONTAINER.md
          files: app/CONTAINER.md
          fail_on_unmatched_files: true
