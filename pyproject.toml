[project]
name = "pi-cag-bench"
version = "0.1.0"
description = "Cache-Augmented-Generation benchmark for Baguettotron on teacher fiches via llama-server"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

# Run:
#   uv sync                      # create/refresh the locked env
#   uv run bench/cag_bench.py    # execute the benchmark
#
# The script also carries inline PEP-723 metadata, so `uv run bench/cag_bench.py`
# works standalone too. This pyproject + uv.lock exist to pin exact versions for a
# reproducible env across machines (notably the Raspberry Pi).

[tool.uv]
package = false
