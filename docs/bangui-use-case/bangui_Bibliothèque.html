document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t scale (Light / Regular / Bold only in product UI) ---- */\n  --fw-light:           300;\n  --fw-regular:         400;\n  --fw-bold:            700;\n\n  /* ---- Size scale ---- */\n  --fs-display:         4rem;      /* 64px — Hero */\n  --fs-section:         3.25rem;   /* 52px — Section */\n  --fs-subheading-lg:   2.3rem;    /* 36.8px — CTA banner */\n  --fs-subheading:      2rem;      /* 32px — Card / modal title */\n  --fs-subheading-sm:   1.6rem;    /* 25.6px — Footer brand */\n  --fs-feature:         1.3rem;    /* 20.8px — Feature title */\n  --fs-body-lg:         1.25rem;   /* 20px — Lede */\n  --fs-body:            1rem;      /* 16px — Body */\n  --fs-code:            0.9375rem; /* 15px */\n  --fs-caption:         0.875rem;  /* 14px */\n  --fs-fine:            0.8125rem; /* 13px */\n  --fs-label:           0.75rem;   /* 12px — Overline */\n  --fs-micro:           0.6875rem; /* 11px — badge small */\n\n  /* ---- Line-heights ---- */\n  --lh-tight:           1.10;\n  --lh-heading:         1.20;\n  --lh-snug:            1.30;\n  --lh-caption:         1.43;\n  --lh-fine:            1.50;\n  --lh-body:            1.60;\n\n  /* ---- Letter-spacing ---- */\n  --ls-tight:           -0.01em;\n  --ls-overline:        0.08em;\n  --ls-eyebrow:         0.10em;\n\n  /* ---- Spacing scale (8px base) ---- */\n  --s-3:   3px;\n  --s-4:   4px;\n  --s-6:   6px;\n  --s-8:   8px;\n  --s-10:  10px;\n  --s-12:  12px;\n  --s-16:  16px;\n  --s-20:  20px;\n  --s-24:  24px;\n  --s-30:  30px;\n  --s-40:  40px;\n  --s-48:  48px;\n  --s-64:  64px;\n  --s-80:  80px;\n  --s-120: 120px;\n\n  /* ---- Radii (system is sharp; four sanctioned exceptions) ---- */\n  --radius-0:          0;\n  --radius-toggle-trk: 3px;\n  --radius-toggle-thb: 2px;\n  --radius-slider-thb: 3px;\n  --radius-avatar:     4px;\n  --radius-dot:        50%;\n\n  /* ---- Depth & elevation ---- */\n  --shadow-whisper:     rgba(0, 0, 0, 0.05) 0 4px 24px;\n  --ring-light:         0 0 0 1px var(--color-beige);\n  --border-hairline:    1px solid var(--color-beige);\n\n  /* ---- Glass (nav / modal / banner / toast / popover glass variant) ---- */\n  --nav-bg-glass:       rgba(255, 255, 255, 0.55);\n  --nav-blur:           blur(18px) saturate(160%);\n\n  /* ---- Whisper tint (sidebar/table/menu hover primitive) ---- */\n  --whisper-tint:       rgba(0, 0, 0, 0.04);\n\n  /* ============================================================\n     SEMANTIC TOKENS — light theme\n     ============================================================ */\n  --bg-page:            var(--color-white);\n  --card-bg:            var(--color-white);\n  --card-bg-soft:       var(--color-beige);\n  --input-bg:           var(--color-white);\n\n  --text-heading:       var(--color-black);\n  --text-body:          var(--color-black);\n  --text-muted:         var(--color-blue);\n  --text-fine:          var(--color-blue);\n\n  --border-light:       var(--color-beige);\n  --border-strong:      var(--color-black);\n\n  --nav-bg:             var(--color-white);\n  --sidebar-bg:         var(--color-beige);\n\n  /* H1 is Coral by brand rule */\n  --h1-color:           var(--color-coral);\n}\n\n/* ============================================================\n   Dark theme — `[data-theme=\"dark\"]` on :root\n   ============================================================ */\n[data-theme=\"dark\"] {\n  --bg-page:            var(--color-black);\n  --card-bg:            var(--color-black);\n  --card-bg-soft:       var(--color-coal);\n  --input-bg:           var(--color-coal);\n\n  --text-heading:       var(--color-white);\n  --text-body:          var(--color-white);\n  --text-muted:         var(--color-muted-white);\n  --text-fine:          var(--color-muted-white);\n\n  --border-light:       rgba(255, 255, 255, 0.15);\n\n  --nav-bg:             var(--color-black);\n  --nav-bg-glass:       rgba(0, 0, 0, 0.45);\n  --sidebar-bg:         var(--color-coal);\n\n  --whisper-tint:       rgba(255, 255, 255, 0.06);\n  --ring-light:         0 0 0 1px rgba(255, 255, 255, 0.15);\n  --border-hairline:    1px solid rgba(255, 255, 255, 0.15);\n}\n\n/* ============================================================\n   BASE ELEMENT STYLES\n   ============================================================ */\nhtml {\n  font-family: var(--font-family);\n  font-weight: var(--fw-regular);\n  color: var(--text-body);\n  background: var(--bg-page);\n  font-size: 16px;\n  line-height: var(--lh-body);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  color: var(--text-body);\n  background: var(--bg-page);\n}\n\n/* ---- Headings ---- */\nh1 {\n  font-family: var(--font-family);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--ls-tight);\n  color: var(--h1-color);         /* Coral, per brand rule */\n  margin: 0 0 var(--s-24);\n}\nh2 {\n  font-family: var(--font-family);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-section);\n  line-height: var(--lh-heading);\n  color: var(--text-heading);\n  margin: 0 0 var(--s-20);\n}\nh3 {\n  font-family: var(--font-family);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-subheading);\n  line-height: var(--lh-tight);\n  color: var(--text-heading);\n  margin: 0 0 var(--s-16);\n}\nh4 {\n  font-family: var(--font-family);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-feature);\n  line-height: var(--lh-heading);\n  color: var(--text-heading);\n  margin: 0 0 var(--s-12);\n}\n\n/* ---- Body & lede ---- */\np {\n  margin: 0 0 var(--s-16);\n  line-height: var(--lh-body);\n}\n.lede,\n.body-lg {\n  font-size: var(--fs-body-lg);\n  line-height: var(--lh-body);\n}\n\n/* ---- Muted metadata / overline ---- */\n.caption  { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-muted); }\n.fine     { font-size: var(--fs-fine);    line-height: var(--lh-fine);    color: var(--text-muted); font-weight: var(--fw-light); }\n.overline {\n  font-size: var(--fs-label);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n  letter-spacing: var(--ls-overline);\n  color: var(--text-muted);\n}\n.eyebrow {\n  font-size: var(--fs-label);\n  font-weight: var(--fw-bold);\n  text-transform: uppercase;\n  letter-spacing: var(--ls-eyebrow);\n  opacity: 0.7;\n}\n\n/* ---- Inline code ---- */\ncode, kbd, pre {\n  font-family: var(--font-family);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: -0.01em;\n  font-size: var(--fs-code);\n}\n\n/* ---- Blockquote ---- */\nblockquote {\n  font-family: var(--font-family);\n  font-style: italic;\n  font-weight: var(--fw-light);\n  font-size: var(--fs-subheading-sm);\n  line-height: var(--lh-snug);\n  margin: 0;\n  padding: 0 0 0 var(--s-20);\n  box-shadow: inset 2px 0 0 var(--color-coral);\n}\n\n/* ---- Links ---- */\na {\n  color: var(--color-coral);\n  text-decoration: none;\n  transition: color 0.15s ease;\n}\na:hover { text-decoration: underline; }\n\n/* ---- Focus (global :focus-visible replacement) ---- */\n:where(a, button, [role=\"button\"], [tabindex]):focus-visible {\n  outline: 2px solid var(--color-focus);\n  outline-offset: 2px;\n}\n<\u002Fstyle>\n  <style>\n    *{ box-sizing:border-box; }\n    body{ margin:0; }\n    .bnu-textarea::placeholder{ color:#102547; opacity:.45; }\n    @keyframes bnuSpin{ to{ transform:rotate(360deg); } }\n    @keyframes bnuFadeUp{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }\n    @keyframes bnuPulse{ 0%,100%{ opacity:.35; } 50%{ opacity:1; } }\n    .bnu-step{ opacity:0; animation:bnuFadeUp .5s ease forwards; }\n    .bnu-chip:hover{ border-color:#FF5B29 !important; color:#FF5B29 !important; }\n    .bnu-btn-coral{ transition:background .2s ease,color .2s ease,border-color .2s ease; }\n    .bnu-btn-coral:hover{ background:transparent !important; color:#FF5B29 !important; }\n    .bnu-btn-out{ transition:background .2s ease,color .2s ease; }\n    .bnu-btn-out:hover{ background:#102547 !important; color:#fff !important; }\n    .bnu-link:hover{ color:#FF5B29 !important; }\n    @media (prefers-reduced-motion: reduce){\n      .bnu-spin{ animation:bnuPulse 1.6s ease-in-out infinite !important; }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:#fff; font-family:var(--font-family); color:#000;\">\n\n  <!-- ===== NAV ===== -->\n  <nav style=\"position:sticky; top:0; z-index:50; height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; background:rgba(255,255,255,.9); backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid #F5EFE6;\">\n    <div style=\"display:flex; align-items:center; gap:16px; cursor:pointer;\" onclick=\"{{ reset }}\">\n      <img src=\"e499fc2a-4c59-4a56-82e6-13e884a3ec12\" alt=\"Bibliothèques Sans Frontières\" style=\"height:26px; display:block;\">\n      <span style=\"width:1px; height:26px; background:#F5EFE6; display:inline-block;\"><\u002Fspan>\n      <span style=\"font-size:13px; font-weight:700; letter-spacing:-.01em; color:#102547; line-height:1.2;\">Bibliothèque numérique universitaire<br><span style=\"font-weight:400; color:#102547; opacity:.65;\">Université de Bangui<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid #F5EFE6; background:#fff;\">\n      <span style=\"width:8px; height:8px; border-radius:50%; background:#0B8741; display:inline-block;\"><\u002Fspan>\n      <span style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#102547;\">Serveur local · hors-ligne<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <!-- ===== HOME ===== -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"position:relative; max-width:780px; margin:0 auto; padding:96px 24px 72px; text-align:center; overflow:visible;\">\n    \n\n    <div style=\"position:relative; z-index:1;\">\n      <div style=\"font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#FF5B29; margin-bottom:20px;\">Assistant de recherche documentaire<\u002Fdiv>\n      <h1 style=\"font-size:56px; line-height:1.08; letter-spacing:-.01em; color:#FF5B29; margin:0 0 24px; text-wrap:balance;\">Que voulez-vous apprendre ?<\u002Fh1>\n      <p style=\"font-size:20px; line-height:1.6; color:#102547; max-width:620px; margin:0 auto 40px;\">Décrivez votre besoin en quelques mots — un sujet de mémoire, une question de cours. L'assistant parcourt le corpus disponible et vous propose des références commentées, en expliquant pourquoi chacune peut vous être utile.<\u002Fp>\n\n      <!-- search box -->\n      <div style=\"border:2px solid #F5EFE6; background:#fff; text-align:left; box-shadow:rgba(0,0,0,.05) 0 4px 24px;\">\n        <textarea class=\"bnu-textarea\" rows=\"3\" value=\"{{ inputValue }}\" onchange=\"{{ onInput }}\" onkeydown=\"{{ onKeyDown }}\" placeholder=\"Par exemple : j'ai besoin de documentation pour un mémoire sur la mécanisation agricole en Afrique subsaharienne…\" style=\"width:100%; border:0; resize:none; padding:22px; font-size:18px; font-family:var(--font-family); line-height:1.55; outline:none; background:transparent; color:#000;\"><\u002Ftextarea>\n        <div style=\"display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 14px 12px 22px; border-top:1px solid #F5EFE6;\">\n          <span style=\"font-size:13px; color:#102547; opacity:.7;\">Formulez votre besoin en langage courant<\u002Fspan>\n          <button class=\"bnu-btn-coral\" onclick=\"{{ onSubmit }}\" style=\"display:inline-flex; align-items:center; gap:8px; background:#FF5B29; color:#fff; border:2px solid #FF5B29; padding:11px 20px; font-family:var(--font-family); font-size:14px; font-weight:400; text-transform:uppercase; letter-spacing:.04em; cursor:pointer; white-space:nowrap;\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n            Rechercher\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- examples -->\n      <div style=\"margin-top:36px;\">\n        <div style=\"font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#102547; opacity:.55; margin-bottom:16px;\">Quelques pistes pour commencer<\u002Fdiv>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px; justify-content:center;\">\n          <sc-for list=\"{{ examples }}\" as=\"ex\" hint-placeholder-count=\"4\">\n            <button class=\"bnu-chip\" data-q=\"{{ ex }}\" onclick=\"{{ pickExample }}\" style=\"border:1px solid #F5EFE6; background:#fff; padding:9px 15px; font-family:var(--font-family); font-size:14px; color:#102547; cursor:pointer; transition:border-color .15s ease,color .15s ease;\">{{ ex }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- credit -->\n    <div style=\"position:relative; z-index:1; margin-top:72px; padding-top:28px; border-top:1px solid #F5EFE6; display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;\">\n      <span style=\"font-size:13px; font-weight:300; color:#102547;\">Corpus en accès ouvert — sélection en co-construction avec<\u002Fspan>\n      <span style=\"font-size:14px; font-weight:700; color:#102547;\">Cairn<\u002Fspan>\n      <span style=\"font-size:13px; font-weight:300; color:#102547;\">et les éditeurs de revues · propulsé par l'Ideas Cube<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===== THINKING ===== -->\n  <sc-if value=\"{{ isThinking }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"max-width:640px; margin:0 auto; padding:140px 24px; text-align:center;\">\n    <div class=\"bnu-spin\" style=\"width:84px; height:84px; margin:0 auto 32px; -webkit-mask:url(&quot;34abf302-9531-44d0-8589-b69ee0d04457&quot;) center/contain no-repeat; mask:url(&quot;34abf302-9531-44d0-8589-b69ee0d04457&quot;) center/contain no-repeat; background:#FF5B29; animation:bnuSpin 3.6s linear infinite;\"><\u002Fdiv>\n    <div style=\"font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#FF5B29; margin-bottom:12px;\">Recherche en cours<\u002Fdiv>\n    <p style=\"font-size:20px; line-height:1.5; color:#102547; margin:0 0 36px;\">«&nbsp;{{ query }}&nbsp;»<\u002Fp>\n    <div style=\"display:inline-flex; flex-direction:column; gap:16px; text-align:left;\">\n      <div class=\"bnu-step\" style=\"animation-delay:.1s; display:flex; align-items:center; gap:12px; font-size:16px; color:#000;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF5B29;display:inline-block;\"><\u002Fspan>Analyse de votre demande<\u002Fdiv>\n      <div class=\"bnu-step\" style=\"animation-delay:.65s; display:flex; align-items:center; gap:12px; font-size:16px; color:#000;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF5B29;display:inline-block;\"><\u002Fspan>Exploration du corpus indexé<\u002Fdiv>\n      <div class=\"bnu-step\" style=\"animation-delay:1.25s; display:flex; align-items:center; gap:12px; font-size:16px; color:#000;\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF5B29;display:inline-block;\"><\u002Fspan>Sélection et rédaction des commentaires<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===== RESULTS ===== -->\n  <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n  <div>\n    <!-- query bar -->\n    <div style=\"position:sticky; top:64px; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid #F5EFE6;\">\n      <div style=\"max-width:900px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px;\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FF5B29\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n        <span style=\"flex:1; font-size:16px; color:#000; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ query }}<\u002Fspan>\n        <button class=\"bnu-link\" onclick=\"{{ editQuery }}\" style=\"background:none; border:0; font-family:var(--font-family); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#102547; cursor:pointer; white-space:nowrap;\">Modifier<\u002Fbutton>\n        <button class=\"bnu-link\" onclick=\"{{ reset }}\" style=\"background:none; border:0; font-family:var(--font-family); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:#FF5B29; cursor:pointer; white-space:nowrap;\">Nouvelle recherche<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <main style=\"max-width:900px; margin:0 auto; padding:40px 24px 96px;\">\n      <div style=\"font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#102547; opacity:.55; margin-bottom:10px;\">Votre recherche<\u002Fdiv>\n      <h2 style=\"font-size:34px; line-height:1.18; letter-spacing:-.01em; color:#000; margin:0 0 8px; max-width:760px;\">La mécanisation agricole en Afrique subsaharienne<\u002Fh2>\n      <p style=\"font-size:15px; color:#102547; margin:0 0 32px;\"><b style=\"font-variant-numeric:tabular-nums;\">{{ count }}<\u002Fb> références sélectionnées dans le corpus · 3 en accès ouvert, 2 sous droits<\u002Fp>\n\n      <!-- synthesis -->\n      <div style=\"background:#F5EFE6; box-shadow:inset 3px 0 0 #FF5B29; padding:24px 28px; margin-bottom:40px;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:14px;\">\n          <img src=\"5d8dba27-616d-4189-bef5-0635f1345cbf\" alt=\"\" style=\"width:20px; height:20px; display:block;\">\n          <span style=\"font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#FF5B29;\">Synthèse de l'assistant<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:17px; line-height:1.6; color:#000; margin:0;\">{{ synthesis }}<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- article list -->\n      <sc-for list=\"{{ articles }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <article class=\"bnu-card\" style=\"border:1px solid #F5EFE6; background:#fff; padding:30px 32px; margin-bottom:24px; box-shadow:rgba(0,0,0,.05) 0 4px 24px;\">\n\n          <div style=\"display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;\">\n            <span style=\"font-size:12px; font-weight:700; color:#102547; font-variant-numeric:tabular-nums; opacity:.55; margin-right:4px;\">{{ a.num }}<\u002Fspan>\n            <sc-if value=\"{{ a.openAccess }}\" hint-placeholder-val=\"{{ true }}\">\n              <span style=\"display:inline-flex; align-items:center; gap:6px; background:#00523C; color:#fff; border:1px solid #00523C; padding:5px 9px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1;\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 11V7a5 5 0 019.9-1\"><\u002Fpath><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"0\"><\u002Frect><\u002Fsvg>\n                Accès ouvert · PDF\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ a.restricted }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"display:inline-flex; align-items:center; gap:6px; background:#102547; color:#fff; border:1px solid #102547; padding:5px 9px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1;\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"0\"><\u002Frect><path d=\"M7 11V7a5 5 0 0110 0v4\"><\u002Fpath><\u002Fsvg>\n                Sous droits · consultation locale\n              <\u002Fspan>\n            <\u002Fsc-if>\n            <span style=\"background:#F5EFE6; color:#000; border:1px solid #F5EFE6; padding:5px 9px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1; font-variant-numeric:tabular-nums;\">{{ a.year }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <h3 style=\"font-size:23px; line-height:1.22; color:#FF5B29; margin:0 0 10px; text-wrap:pretty;\">{{ a.title }}<\u002Fh3>\n          <div style=\"font-size:14px; line-height:1.5; color:#102547; margin-bottom:20px;\">{{ a.authors }} — <i>{{ a.journal }}<\u002Fi>, {{ a.publisher }} · <span style=\"font-weight:700;\">via Cairn<\u002Fspan><\u002Fdiv>\n\n          <div style=\"background:#F5EFE6; box-shadow:inset 3px 0 0 #FF5B29; padding:16px 20px; margin-bottom:18px;\">\n            <div style=\"font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:#FF5B29; margin-bottom:8px;\">Pourquoi cette référence<\u002Fdiv>\n            <p style=\"font-size:15px; line-height:1.6; color:#000; margin:0;\">{{ a.commentary }}<\u002Fp>\n          <\u002Fdiv>\n\n          <blockquote style=\"font-style:italic; font-weight:300; font-size:17px; line-height:1.4; color:#102547; margin:0 0 22px; padding-left:18px; box-shadow:inset 2px 0 0 #F5EFE6;\">{{ a.citation }}<\u002Fblockquote>\n\n          <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap;\">\n            <sc-if value=\"{{ a.openAccess }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"bnu-btn-coral\" style=\"display:inline-flex; align-items:center; gap:8px; background:#FF5B29; color:#fff; border:2px solid #FF5B29; padding:10px 18px; font-family:var(--font-family); font-size:13px; font-weight:400; text-transform:uppercase; letter-spacing:.04em; cursor:pointer;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"M7 10l5 5 5-5\"><\u002Fpath><path d=\"M4 21h16\"><\u002Fpath><\u002Fsvg>\n                Lire l'article · PDF\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ a.restricted }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"bnu-btn-out\" style=\"display:inline-flex; align-items:center; gap:8px; background:transparent; color:#102547; border:2px solid #102547; padding:10px 18px; font-family:var(--font-family); font-size:13px; font-weight:400; text-transform:uppercase; letter-spacing:.04em; cursor:pointer;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                Consulter sur place\n              <\u002Fbutton>\n            <\u002Fsc-if>\n            <button class=\"bnu-link\" style=\"background:none; border:0; font-family:var(--font-family); font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#102547; cursor:pointer; padding:10px 4px;\">Citer cette source<\u002Fbutton>\n          <\u002Fdiv>\n\n        <\u002Farticle>\n      <\u002Fsc-for>\n\n      <p style=\"font-size:13px; font-weight:300; color:#102547; text-align:center; margin:32px 0 0;\">Chaque réponse crédite la revue et l'éditeur. Les contenus sous droits sont chiffrés sur l'appareil, ni exportables ni redistribuables.<\u002Fp>\n    <\u002Fmain>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { screen: 'home', query: '', inputValue: '' };\n\n  EXAMPLES = [\n    'Mécanisation agricole en Afrique subsaharienne',\n    'Accès à l\\u2019eau potable en milieu rural',\n    'Microfinance et petites exploitations',\n    'Genre et travail agricole au Sahel',\n  ];\n\n  SYNTHESIS = 'La mécanisation agricole en Afrique subsaharienne se lit moins comme une histoire de machines que comme une histoire de choix : quels outils, pour quelles exploitations, à quel coût social et écologique. Les cinq références ci-dessous couvrent ce spectre — du cadrage historique aux données de terrain, des effets de genre aux politiques publiques, jusqu\\u2019au débat agronomique sur la santé des sols. Commencez par la première pour situer le débat, puis piochez selon l\\u2019angle de votre mémoire.';\n\n  ARTICLES = [\n    {\n      num: '01', year: '2021', openAccess: true,\n      title: 'Mécaniser sans exclure : trajectoires de la motorisation agricole en Afrique subsaharienne',\n      authors: 'Pascal Grégoire, Aminata Touré',\n      journal: 'Revue Tiers Monde', publisher: 'Armand Colin',\n      commentary: 'Un point de départ idéal pour un mémoire : l\\u2019article retrace cinquante ans de politiques de mécanisation et distingue nettement les échecs des grands programmes étatiques des réussites plus récentes fondées sur de petits équipements. Utile pour poser le cadre historique et problématiser votre sujet.',\n      citation: '«\\u00a0La motorisation n\\u2019a de sens que si elle épouse la structure des exploitations qu\\u2019elle prétend servir.\\u00a0»',\n    },\n    {\n      num: '02', year: '2019', openAccess: false,\n      title: 'Tracteurs, attelages et houes : l\\u2019équipement des petites exploitations sahéliennes',\n      authors: 'Ibrahima Sow, Claire Bénard',\n      journal: 'Économie rurale', publisher: 'Société française d\\u2019économie rurale',\n      commentary: 'Cet article apporte les données de terrain qui manquent souvent : niveaux d\\u2019équipement, coûts, recours à la location entre voisins. À mobiliser pour la partie empirique de votre travail. Consultable sur place, non exportable.',\n      citation: '«\\u00a0Entre la houe manuelle et le tracteur, c\\u2019est tout un éventail de solutions intermédiaires qui détermine l\\u2019accès réel à la mécanisation.\\u00a0»',\n    },\n    {\n      num: '03', year: '2022', openAccess: true,\n      title: 'Genre, travail et mécanisation : qui gagne du temps quand la machine arrive ?',\n      authors: 'Fatou Diallo, Marie-Hélène Aubert',\n      journal: 'Cahiers du Genre', publisher: 'L\\u2019Harmattan',\n      commentary: 'Une entrée par le genre, souvent attendue par les jurys. L\\u2019article montre que la mécanisation redistribue les tâches entre hommes et femmes de façon inégale. Parfait pour un chapitre consacré aux effets sociaux du changement technique.',\n      citation: '«\\u00a0La machine ne libère pas le temps de la même manière selon qu\\u2019on tient la charrue ou qu\\u2019on prépare le repas du champ.\\u00a0»',\n    },\n    {\n      num: '04', year: '2020', openAccess: false,\n      title: 'Politiques publiques de mécanisation : ce que nous apprennent les programmes ouest-africains',\n      authors: 'Kwame Mensah, Sylvie Rocher',\n      journal: 'Afrique contemporaine', publisher: 'De Boeck Supérieur',\n      commentary: 'Une analyse comparée (Mali, Sénégal, Ghana) précieuse pour la dimension institutionnelle : subventions, importation de tracteurs, rôle des coopératives. À citer pour discuter des recommandations de votre mémoire.',\n      citation: '«\\u00a0Subventionner la machine sans organiser son entretien revient à financer son immobilisation.\\u00a0»',\n    },\n    {\n      num: '05', year: '2023', openAccess: true,\n      title: 'Mécanisation et santé des sols : un dilemme agronomique pour l\\u2019agriculture subsaharienne',\n      authors: 'Jean-Baptiste Koffi, Léa Marchand',\n      journal: 'Cahiers Agricultures', publisher: 'EDP Sciences',\n      commentary: 'Pour ouvrir une discussion critique : le labour mécanisé peut dégrader des sols fragiles. L\\u2019article propose des alternatives (travail minimal du sol) et permet de nuancer votre conclusion par un regard agronomique.',\n      citation: '«\\u00a0Le tracteur règle un problème de force de travail mais en déplace un autre, sous la surface, vers la structure du sol.\\u00a0»',\n    },\n  ];\n\n  submit(q) {\n    const query = ((q != null ? q : this.state.inputValue) || '').trim();\n    if (!query) return;\n    this.setState({ screen: 'thinking', query, inputValue: query });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ screen: 'results' }), 2100);\n    if (typeof window !== 'undefined') window.scrollTo({ top: 0 });\n  }\n\n  componentWillUnmount() { clearTimeout(this._t); }\n\n  renderVals() {\n    const s = this.state.screen;\n    const articles = this.ARTICLES.map(a => ({ ...a, restricted: !a.openAccess }));\n    return {\n      isHome: s === 'home',\n      isThinking: s === 'thinking',\n      isResults: s === 'results',\n      query: this.state.query,\n      inputValue: this.state.inputValue,\n      examples: this.EXAMPLES,\n      synthesis: this.SYNTHESIS,\n      articles,\n      count: articles.length,\n      onInput: (e) => this.setState({ inputValue: e.target.value }),\n      onKeyDown: (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.submit(); } },\n      onSubmit: () => this.submit(),\n      pickExample: (e) => this.submit(e.currentTarget.dataset.q),\n      reset: () => { clearTimeout(this._t); this.setState({ screen: 'home', query: '', inputValue: '' }); },\n      editQuery: () => { clearTimeout(this._t); this.setState({ screen: 'home', inputValue: this.state.query }); },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
